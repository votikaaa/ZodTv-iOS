name: Build iOS IPA (ZodTv)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build & Package iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project ZodTv-iOS/ZodTv.xcodeproj \
            -scheme ZodTv \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZodTv.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/ZodTv.xcarchive/Products/Applications/ZodTv.app Payload/
          zip -r ZodTv.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZodTv-iOS-IPA
          path: ZodTv.ipa
          retention-days: 14
